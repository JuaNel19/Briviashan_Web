<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 270" width="100%" height="100%">
  <defs>
    <!-- Filtro de sombra suave -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    
    <!-- Gradientes para las hojas -->
    <linearGradient id="leafCenter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="50%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>

    <linearGradient id="leafLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>

    <linearGradient id="leafRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
  </defs>

  <g filter="url(#glow)">
    <!-- 1. ISOTIPO: HOJAS / BROTE DE ESPÁRRAGO -->
    <!-- Hoja Izquierda -->
    <path d="M 188 108 C 172 82 178 48 198 32 C 206 58 206 90 196 114 Z" 
          fill="url(#leafLeft)" stroke="#0f3d27" stroke-width="3.5" stroke-linejoin="round"/>

    <!-- Hoja Derecha -->
    <path d="M 238 108 C 254 82 248 48 228 32 C 220 58 220 90 230 114 Z" 
          fill="url(#leafRight)" stroke="#0f3d27" stroke-width="3.5" stroke-linejoin="round"/>

    <!-- Hoja Central Principal -->
    <path d="M 213 14 C 196 42 194 80 203 118 C 213 125 214 125 223 118 C 232 80 230 42 213 14 Z" 
          fill="url(#leafCenter)" stroke="#0f3d27" stroke-width="4" stroke-linejoin="round"/>
    
    <!-- Nervadura central hoja principal -->
    <path d="M 213 22 L 213 118" stroke="#15803d" stroke-width="2.5" stroke-linecap="round"/>

    <!-- 2. SWOOSH / CURVA DINÁMICA DE LA 'V' -->
    <path d="M 160 112 C 178 114 195 130 213 162 C 230 118 290 88 385 106 C 315 88 238 118 213 145 C 192 122 175 110 160 112 Z" 
          fill="#34d399" stroke="#ffffff" stroke-width="1.5"/>

    <!-- 3. TIPOGRAFÍA PRINCIPAL: BRIVIASHAN -->
    <g fill="#ffffff" font-family="'Plus Jakarta Sans', 'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="64" letter-spacing="2">
      <text x="45" y="172">BRI</text>
      <text x="222" y="172">IASHAN</text>
    </g>

    <!-- 4. SUBTÍTULO: AGROEXPORTACIONES EIRL -->
    <text x="250" y="218" 
          fill="#52b788" 
          font-family="'Plus Jakarta Sans', 'Inter', sans-serif" 
          font-size="21" 
          font-weight="800" 
          letter-spacing="9" 
          text-anchor="middle">
      AGROEXPORTACIONES
    </text>

    <text x="250" y="250" 
          fill="#f1f5f9" 
          font-family="'Plus Jakarta Sans', 'Inter', sans-serif" 
          font-size="18" 
          font-weight="700" 
          letter-spacing="12" 
          text-anchor="middle">
      EIRL
    </text>
  </g>
</svg>
